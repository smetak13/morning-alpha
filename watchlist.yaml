tickers:
  - ticker: NVDA
    thesis:
      why_i_watch_it:
        - AI infrastructure demand is a key market driver
      bull_case:
        - data center revenue keeps compounding
      bear_case:
        - hyperscaler capex slows
      key_metrics:
        - data center revenue growth
        - gross margin
      red_flags:
        - export restrictions
        - customer concentration
      action_triggers:
        - flag if guidance implies a material demand slowdown

  - ticker: GOOGL
    thesis:
      why_i_watch_it:
        - dominant position in search and digital advertising
        - strong AI capabilities and infrastructure
        - cloud business still has meaningful growth potential
      bull_case:
        - AI enhances search monetization
        - Google Cloud continues accelerating growth
      bear_case:
        - AI disrupts traditional search economics
        - regulatory pressure weakens core businesses
      key_metrics:
        - search revenue growth
        - Google Cloud growth
        - operating margin
      red_flags:
        - declining search market share
        - increasing AI infrastructure costs without monetization
        - antitrust actions
      action_triggers:
        - flag if search revenue growth turns negative
        - flag if cloud growth falls below 15%

  - ticker: IBM
    thesis:
      why_i_watch_it:
        - enterprise AI adoption may benefit IBM's software portfolio
        - growing focus on hybrid cloud and consulting
      bull_case:
        - AI-related software revenue accelerates
        - Red Hat continues driving growth
      bear_case:
        - legacy business offsets growth initiatives
        - AI adoption remains slower than expected
      key_metrics:
        - software revenue growth
        - free cash flow
        - Red Hat growth
      red_flags:
        - stagnant software growth
        - declining consulting demand
      action_triggers:
        - flag if software growth falls below 5%

  - ticker: IONQ
    thesis:
      why_i_watch_it:
        - one of the leading public quantum computing companies
        - potential long-term winner if quantum computing reaches commercial scale
      bull_case:
        - significant technological breakthroughs
        - enterprise adoption accelerates
      bear_case:
        - commercialization takes much longer than expected
        - competing technologies gain advantage
      key_metrics:
        - bookings growth
        - revenue growth
        - cash runway
      red_flags:
        - repeated delays in technology roadmap
        - weakening balance sheet
      action_triggers:
        - flag if cash runway drops below two years
        - flag if bookings decline year-over-year

  - ticker: RGTI
    thesis:
      why_i_watch_it:
        - speculative exposure to quantum computing
        - potential upside if superconducting quantum systems succeed
      bull_case:
        - technology milestones achieved ahead of expectations
        - increasing commercial partnerships
      bear_case:
        - dilution and capital requirements remain high
        - technology falls behind competitors
      key_metrics:
        - cash position
        - technology roadmap progress
        - strategic partnerships
      red_flags:
        - significant equity dilution
        - missed technical milestones
      action_triggers:
        - flag if company raises capital at distressed valuations
        - flag if major roadmap milestones are delayed

  - ticker: SOFI
    thesis:
      why_i_watch_it:
        - digital banking platform with expanding product ecosystem
        - potential beneficiary of continued fintech adoption
      bull_case:
        - member growth remains strong
        - banking segment drives profitability expansion
      bear_case:
        - credit quality deteriorates
        - loan growth slows significantly
      key_metrics:
        - member growth
        - adjusted EBITDA
        - net revenue growth
      red_flags:
        - rising loan defaults
        - declining deposit growth
      action_triggers:
        - flag if member growth falls below 20%
        - flag if credit losses increase materially

  - ticker: IREN
    thesis:
      why_i_watch_it:
        - leveraged exposure to AI datacenter and GPU infrastructure growth
        - access to large-scale power capacity is becoming a strategic asset
        - potential beneficiary of the AI compute buildout cycle
      bull_case:
        - hyperscaler and enterprise AI demand continues accelerating
        - GPU cloud utilization remains high
        - power-constrained competitors struggle to expand capacity
      bear_case:
        - AI capex cycle slows
        - GPU supply increases faster than demand
        - heavy capital spending dilutes shareholders
      key_metrics:
        - energized datacenter capacity (MW)
        - GPU deployment
        - AI cloud revenue
        - contracted AI backlog
      red_flags:
        - large equity dilution
        - declining GPU utilization
        - delays in datacenter construction
        - slowing hyperscaler demand
      action_triggers:
        - flag if AI cloud revenue growth materially slows
        - flag if major datacenter projects are delayed
        - flag if company raises significant equity without matching capacity growth

  - ticker: DBX
    thesis:
      why_i_watch_it:
        - strong free cash flow generation
        - shareholder-friendly capital allocation through buybacks
        - potentially undervalued software company
      bull_case:
        - continued growth in paying users and ARPU
        - efficient capital returns increase per-share value
      bear_case:
        - collaboration software market becomes more competitive
        - limited growth profile constrains valuation expansion
      key_metrics:
        - free cash flow
        - paying users
        - average revenue per user
      red_flags:
        - slowing user growth
        - declining free cash flow margins
        - reduced buyback activity
      action_triggers:
        - flag if free cash flow declines year-over-year
        - flag if paying user growth turns negative

  - ticker: NU
    thesis:
      why_i_watch_it:
        - leading digital banking platform in Latin America
        - large growth runway due to low banking penetration
        - scalable business model with expanding product ecosystem
      bull_case:
        - customer growth remains strong
        - cross-selling increases revenue per customer
        - operating leverage drives profitability
      bear_case:
        - credit losses rise during economic slowdown
        - competition intensifies across key markets
        - regulatory environment becomes less favorable
      key_metrics:
        - customer growth
        - average revenue per active customer
        - net interest margin
        - credit loss ratio
      red_flags:
        - rising delinquency rates
        - slowing customer acquisition
        - declining profitability
      action_triggers:
        - flag if customer growth falls below 15%
        - flag if credit loss ratio rises materially
        - flag if profitability deteriorates for two consecutive quarters

  - ticker: NOW
    thesis:
      why_i_watch_it:
        - leading enterprise workflow and automation platform
        - strong recurring revenue model
        - potential beneficiary of AI-driven productivity adoption
      bull_case:
        - AI features increase customer spending and retention
        - enterprise workflow automation continues expanding across departments
        - operating leverage drives margin expansion
      bear_case:
        - enterprise IT spending slows
        - AI capabilities fail to generate meaningful incremental revenue
        - competition from Microsoft and other platform vendors intensifies
      key_metrics:
        - subscription revenue growth
        - remaining performance obligations (RPO)
        - operating margin
        - customer retention
      red_flags:
        - slowing large customer additions
        - declining subscription growth
        - weakening RPO growth
      action_triggers:
        - flag if subscription revenue growth falls below 15%
        - flag if RPO growth slows materially
        - flag if operating margins deteriorate for two consecutive quarters

  - ticker: SPGI
    thesis:
      why_i_watch_it:
        - mission-critical financial data and ratings franchise
        - highly recurring and asset-light business model
        - strong pricing power and durable competitive moat
      bull_case:
        - capital markets activity rebounds
        - continued growth in index and data businesses
        - operating leverage drives earnings growth
      bear_case:
        - prolonged weakness in debt issuance
        - regulatory pressure on ratings agencies
        - slower growth in financial data subscriptions
      key_metrics:
        - revenue growth
        - operating margin
        - ratings revenue
        - recurring subscription revenue
      red_flags:
        - declining debt issuance activity
        - regulatory investigations
        - slowing recurring revenue growth
      action_triggers:
        - flag if recurring revenue growth falls below 5%
        - flag if operating margin declines for two consecutive quarters
        - flag if ratings revenue deteriorates materially