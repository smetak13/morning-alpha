tickers:
  - ticker: MSFT
    position_size_pct: 18
    thesis:
      why_i_own_it:
        - dominant enterprise software ecosystem
        - Azure cloud growth
        - strong AI positioning through OpenAI partnership
      bull_case:
        - Azure continues gaining market share
        - AI products increase monetization per customer
      bear_case:
        - cloud growth decelerates significantly
        - AI investments fail to generate expected returns
      key_metrics:
        - Azure growth
        - operating margin
        - free cash flow
      red_flags:
        - slowing enterprise spending
        - margin compression
        - loss of cloud market share
      action_triggers:
        - if Azure growth drops below 15%, flag for review
        - if operating margin declines for two consecutive quarters, flag for review

