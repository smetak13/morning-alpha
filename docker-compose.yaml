services:
  morning-alpha:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
    ports:
      - "8000:8000"
    restart: unless-stopped

  report-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
    command: ["python", "report_scheduler.py"]
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-5}
      WORKER_LOG_LEVEL: ${WORKER_LOG_LEVEL:-INFO}
    command: ["python", "worker.py"]
    restart: unless-stopped
