  price_move_abs_3pct: 15
  price_move_abs_5pct: 25
  volume_ratio_2x: 15
  event_weights:
    earnings: 35
    guidance: 35
    m_and_a: 30
    regulation: 30
    lawsuit: 25
    buyback: 20
    dividend: 15
    sec_filing: 25
