timezone: Europe/Prague
report_time: "08:00"

fmp:
  base_url: https://financialmodelingprep.com/stable
  news_limit_per_ticker: 30
  general_news_limit: 40
  fmp_articles_limit: 30
  request_timeout_seconds: 20

openai:
  model: gpt-4.1-mini
  deep_research_model: gpt-5.4
  max_input_items: 35
  pricing_per_1m_tokens:
    gpt-4.1-mini:
      input: 0.40
      cached_input: 0.10
      output: 1.60
    gpt-5.4:
      input: 2.50
      cached_input: 0.25
      output: 15

email:
  subject_prefix: "📈 Personalized investment morning report"

